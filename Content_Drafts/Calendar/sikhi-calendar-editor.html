<script>/* ============================================================================
   overrides.js — your edits to the built-in calendar
   ----------------------------------------------------------------------------
   The 876 jantri entries are transcribed from the printed calendar and every
   one is cross-checked against the engine. They are the record, so nothing here
   ever writes to them. Instead this keeps a separate layer of DIFFERENCES, and
   the views apply that layer on the way out.

   Why it matters: the verified data stays verifiable. Delete your overrides and
   you are back to exactly what the JANTRI printed. Export them and someone else
   can apply the same changes to the same base. Neither is possible if you edit
   the source rows in place.

   Two scopes, because two different things get edited:

     SERIES     keyed by the event's English name. Renaming Guru Nanak Sahib's
                Prakash Purab, or switching Panchami off, means every year — so
                these edits key on the name, not the date.
                { en, pa, cat, off, offFrom }

     OCCURRENCE keyed by date + name. Moving one year's date, or hiding a single
                instance, must not touch the other years.
                { to, off }

     CUSTOM     a date the sangat keeps that is not in the jantri at all, keyed
                by its own id. Anchored to an English date or a Panjabi one,
                once or every year — the same choice personal events offer, but
                shared with everyone rather than living on one device.
                { anchor, repeat, iso | m + d, en, pa, cat, note, major }

   `offFrom` is what makes "off for the future" work: history stays intact and
   the entry stops appearing from that date on. A calendar people have already
   planned around should not rewrite its own past.

   SYNC
   Every patch carries `_ts`, and deleting one writes a tombstone rather than
   removing the key. Both exist for the same reason: two devices editing the
   same calendar have to be merged per key, and a plain delete is
   indistinguishable from "this device has not heard about it yet" — so without
   tombstones, deleting a change on your phone would be silently undone by your
   laptop the next time it synced.
   ========================================================================= */

const Overrides = (function () {
  'use strict';

  const KEY = 'sikhi-calendar.overrides.v1';
  const SCOPES = ['series', 'occurrence', 'custom'];

  let data = read();

  function read() {
    try {
      const raw = JSON.parse(localStorage.getItem(KEY));
      return {
        series: (raw && raw.series) || {},
        occurrence: (raw && raw.occurrence) || {},
        custom: (raw && raw.custom && !Array.isArray(raw.custom)) ? raw.custom : {}
      };
    } catch (e) {
      return { series: {}, occurrence: {}, custom: {} };
    }
  }

  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {}
    rebuildIndex();
  }

  /* ------------------------------------------------------------------ keys */

  const seriesKey = e => String(e.en || e.pa || '').trim();
  const occKey = (iso, e) => iso + '|' + seriesKey(e);

  /* -------------------------------------------------- reverse index for moves
     A moved event has to disappear from its old date and appear on its new one,
     so the day lookup needs to answer "what was moved INTO this date?" cheaply.
  */

  let movedInto = {};

  function rebuildIndex() {
    movedInto = {};
    Object.keys(data.occurrence).forEach(k => {
      const o = data.occurrence[k];
      if (!o || !o.to) return;
      const parts = k.split('|');
      const fromIso = parts[0], en = parts.slice(1).join('|');
      (movedInto[o.to] = movedInto[o.to] || []).push({ fromIso: fromIso, en: en });
    });
  }
  rebuildIndex();

  /* --------------------------------------------------------------- querying */

  const live = p => (p && !p._deleted ? p : null);

  function series(e) { return live(data.series[seriesKey(e)]); }
  function occurrence(iso, e) { return live(data.occurrence[occKey(iso, e)]); }

  /** Is this event switched off on this date? */
  function isOff(e, iso) {
    const o = occurrence(iso, e);
    if (o && o.off) return true;
    const s = series(e);
    if (!s || !s.off) return false;
    // offFrom set: history is preserved, the future is hidden.
    if (s.offFrom) return iso >= s.offFrom;
    return true;
  }

  /**
   * Apply the layer to one day's built-in events.
   * @param list  events from SikhEvents.builtInFor
   * @param iso   the day, so occurrence rules can be found
   * @param lookup (fromIso, en) => event | null   to materialise moved entries
   */
  function apply(list, iso, lookup) {
    const out = [];

    list.forEach(e => {
      const occ = occurrence(iso, e);
      if (occ && occ.to && occ.to !== iso) return;   // moved away from today
      if (isOff(e, iso)) return;
      out.push(decorate(e, iso));
    });

    // Dates the sangat added that are not in the jantri at all.
    const ns = Cal.fromGregorian(Nanakshahi.parseIso(iso));
    customList().forEach(e => {
      if (!customOn(e, Nanakshahi.parseIso(iso), ns)) return;
      out.push(Object.assign({}, e, {
        id: 'cu-' + e.id, source: 'custom', edited: true,
        greg: Nanakshahi.parseIso(iso), ns: ns
      }));
    });

    // Anything moved onto this date from elsewhere.
    (movedInto[iso] || []).forEach(m => {
      const src = lookup && lookup(m.fromIso, m.en);
      if (!src) return;
      if (isOff(src, iso)) return;
      out.push(decorate(Object.assign({}, src, {
        greg: Nanakshahi.parseIso(iso),
        ns: Cal.fromGregorian(Nanakshahi.parseIso(iso))
      }), iso, m.fromIso));
    });

    return out;
  }

  /** Overlay renames and recategorisation, and mark the event as edited. */
  function decorate(e, iso, movedFrom) {
    const s = series(e);
    if (!s && !movedFrom) return e;
    const out = Object.assign({}, e);
    if (s) {
      if (s.en) out.en = s.en;
      if (s.pa) out.pa = s.pa;
      if (s.cat) out.cat = s.cat;
    }
    out.edited = true;
    if (movedFrom) out.movedFrom = movedFrom;
    return out;
  }

  /* ---------------------------------------------------------------- editing */

  /** Strip the keys that are back to default, so the layer stays minimal. */
  function tidy(next) {
    Object.keys(next).forEach(k => {
      if (k === '_ts' || k === '_deleted') return;
      if (next[k] === '' || next[k] == null || next[k] === false) delete next[k];
    });
    return next;
  }

  const meaningful = p => Object.keys(p).some(k => k !== '_ts' && k !== '_deleted');

  function write(scope, key, next) {
    next._ts = Date.now();
    if (meaningful(next)) {
      delete next._deleted;
      data[scope][key] = next;
    } else if (data[scope][key]) {
      // Was set, now cleared — a tombstone, so other devices learn about it.
      data[scope][key] = { _deleted: true, _ts: next._ts };
    } else {
      delete data[scope][key];
    }
    persist();
    return live(data[scope][key]);
  }

  function setSeries(key, patch) {
    const cur = live(data.series[key]) || {};
    return write('series', key, tidy(Object.assign({}, cur, patch)));
  }

  function setOccurrence(iso, e, patch) {
    const k = occKey(iso, e);
    const cur = live(data.occurrence[k]) || {};
    const next = tidy(Object.assign({}, cur, patch));
    if (next.to === iso) delete next.to;             // moved back to where it was
    return write('occurrence', k, next);
  }

  /* ------------------------------------------------------ custom purabs */

  function customList() {
    return Object.keys(data.custom)
      .map(id => live(data.custom[id]) && Object.assign({ id }, data.custom[id]))
      .filter(Boolean)
      .sort((a, b) => String(a.en || a.pa).localeCompare(String(b.en || b.pa)));
  }

  function saveCustom(entry) {
    const id = entry.id ||
      ('cu-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7));
    const clean = {
      en: String(entry.en || '').trim(),
      pa: String(entry.pa || '').trim(),
      cat: entry.cat || 'historic',
      note: String(entry.note || '').trim(),
      anchor: entry.anchor === 'gregorian' ? 'gregorian' : 'nanakshahi',
      repeat: entry.repeat === 'once' ? 'once' : 'yearly',
      major: !!entry.major
    };
    if (clean.anchor === 'gregorian') clean.iso = entry.iso || '';
    else { clean.m = Number(entry.m) || 1; clean.d = Number(entry.d) || 1;
           clean.nsYear = entry.nsYear ? Number(entry.nsYear) : null; }
    if (!clean.en && !clean.pa) return null;
    return write('custom', id, clean);
  }

  function deleteCustom(id) { write('custom', id, {}); }

  /** Does a custom entry land on this date? Mirrors the personal-event rule. */
  function customOn(e, g, ns) {
    if (e.anchor === 'gregorian') {
      if (!e.iso) return false;
      const src = Nanakshahi.parseIso(e.iso);
      if (e.repeat === 'yearly') {
        return src.getMonth() === g.getMonth() && src.getDate() === g.getDate();
      }
      return Nanakshahi.isoKey(src) === Nanakshahi.isoKey(g);
    }
    if (!e.m || !e.d) return false;
    if (e.m !== ns.month || e.d !== ns.day) return false;
    if (e.repeat === 'yearly') return true;
    return e.nsYear === ns.year;
  }

  function clearSeries(key) { write('series', key, {}); }
  function clearOccurrence(iso, e) { write('occurrence', occKey(iso, e), {}); }

  function clearAll() {
    // Tombstone everything rather than dropping it, so the reset propagates.
    const ts = Date.now();
    SCOPES.forEach(scope => {
      Object.keys(data[scope]).forEach(k => { data[scope][k] = { _deleted: true, _ts: ts }; });
    });
    persist();
  }

  const count = () => SCOPES
    .reduce((n, scope) => n + Object.keys(data[scope]).filter(k => live(data[scope][k])).length, 0);

  /* ------------------------------------------------------------------ merge
     Per key, the later timestamp wins. Whole-document replacement would mean
     whichever device synced last silently erased the other's work.
     @returns { applied, skipped }
  */
  function merge(remote) {
    let applied = 0, skipped = 0;
    SCOPES.forEach(scope => {
      const incoming = (remote && remote[scope]) || {};
      Object.keys(incoming).forEach(k => {
        const theirs = incoming[k], mine = data[scope][k];
        if (!theirs || typeof theirs._ts !== 'number') { skipped++; return; }
        if (mine && Number(mine._ts || 0) >= theirs._ts) { skipped++; return; }
        data[scope][k] = theirs;
        applied++;
      });
    });
    if (applied) persist();
    return { applied, skipped };
  }

  /** Keys changed since a timestamp — what this device still owes the server. */
  function changedSince(ts) {
    const out = { series: {}, occurrence: {}, custom: {} };
    let n = 0;
    SCOPES.forEach(scope => {
      Object.keys(data[scope]).forEach(k => {
        const p = data[scope][k];
        if (Number(p._ts || 0) > Number(ts || 0)) { out[scope][k] = p; n++; }
      });
    });
    out.count = n;
    return out;
  }

  /** The newest timestamp this device holds. */
  function latestTs() {
    let max = 0;
    SCOPES.forEach(scope => {
      Object.keys(data[scope]).forEach(k => {
        max = Math.max(max, Number(data[scope][k]._ts || 0));
      });
    });
    return max;
  }

  function all() { return JSON.parse(JSON.stringify(data)); }

  /* ------------------------------------------------------- export / import */

  function exportJson() {
    return JSON.stringify({
      app: 'Sikhi Calendar',
      kind: 'overrides',
      exported: new Date().toISOString(),
      base: { from: SikhEvents.COVERED_FROM, to: SikhEvents.COVERED_TO,
              rows: SikhEvents.JANTRI.length },
      overrides: data
    }, null, 2);
  }

  function importJson(text) {
    const parsed = JSON.parse(text);
    const o = parsed.overrides || parsed;
    if (!o || typeof o !== 'object') throw new Error('Not an overrides file.');
    data = {
      series: o.series || {},
      occurrence: o.occurrence || {},
      custom: o.custom || []
    };
    persist();
    return count();
  }

  /**
   * A human-readable summary, for the export file and the UI. This is what you
   * would hand to whoever maintains the TSVs so the edits can be folded into
   * the source properly.
   */
  function report() {
    const lines = [];
    Object.keys(data.series).sort().forEach(k => {
      const s = live(data.series[k]);
      if (!s) return;
      const bits = [];
      if (s.en) bits.push('renamed to "' + s.en + '"');
      if (s.pa) bits.push('Gurmukhi changed');
      if (s.cat) bits.push('category -> ' + s.cat);
      if (s.off) bits.push(s.offFrom ? 'off from ' + s.offFrom : 'off entirely');
      lines.push('SERIES  ' + k + ' — ' + bits.join(', '));
    });
    customList().forEach(e => {
      lines.push('ADDED   ' + (e.en || e.pa) + ' — ' +
        (e.anchor === 'gregorian' ? e.iso : e.d + '/' + e.m + ' Nanakshahi') +
        (e.repeat === 'yearly' ? ', every year' : ''));
    });
    Object.keys(data.occurrence).sort().forEach(k => {
      const o = live(data.occurrence[k]);
      if (!o) return;
      const bits = [];
      if (o.to) bits.push('moved to ' + o.to);
      if (o.off) bits.push('hidden');
      lines.push('DATE    ' + k + ' — ' + bits.join(', '));
    });
    return lines;
  }

  return {
    seriesKey, occKey, series, occurrence, isOff, apply,
    setSeries, setOccurrence, clearSeries, clearOccurrence, clearAll,
    customList, saveCustom, deleteCustom, customOn,
    count, all, exportJson, importJson, report,
    merge, changedSince, latestTs
  };
})();
</script>
<script>/* ============================================================================
   editor.js — the calendar editor page
   ----------------------------------------------------------------------------
   A standalone admin page for the charity website. It edits the SAME overrides
   layer the app does, through the same sync server, so a change made here shows
   up on every phone in the sangat within seconds.

   It talks to the server directly rather than reusing js/sync.js: the app's
   sync layer is built around a device that also holds a local calendar and runs
   in the background. This page has one job and does it in the foreground.

   SECURITY, stated plainly. This page is not secret — anyone with the URL can
   load it and read the calendar, which is already public. What it cannot do
   without the passphrase is save anything: every write is refused by the server
   with a 401. So the page is safe to host, and the passphrase is the only thing
   that matters. Keep it to the one sevadaar who maintains the calendar.
   ========================================================================= */

(function () {
  'use strict';

  var ENDPOINT = 'https://sikhi-calendar-sync.shaheediibunga.workers.dev';
  var LS = 'sikhi-calendar-editor.v1';

  var $ = function (id) { return document.getElementById(id); };
  var esc = function (t) {
    return String(t == null ? '' : t)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  };

  var cfg = load();
  var editing = null;          // { kind:'purab'|'custom', key }
  var busy = false;

  function load() {
    try { return JSON.parse(localStorage.getItem(LS)) || { token: '' }; }
    catch (e) { return { token: '' }; }
  }
  function save() { try { localStorage.setItem(LS, JSON.stringify(cfg)); } catch (e) {} }

  /* ------------------------------------------------------------- transport */

  function api(path, opts) {
    var o = opts || {};
    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, 15000);
    return fetch(ENDPOINT + path, {
      method: o.method || 'GET',
      cache: 'no-store',
      signal: ctrl.signal,
      headers: Object.assign(
        o.body ? { 'content-type': 'application/json' } : {},
        o.auth && cfg.token ? { authorization: 'Bearer ' + cfg.token } : {}),
      body: o.body ? JSON.stringify(o.body) : undefined
    }).then(function (r) {
      return r.text().then(function (t) {
        var j = null; try { j = t ? JSON.parse(t) : null; } catch (e) {}
        if (!r.ok) throw new Error((j && j.error) || ('HTTP ' + r.status));
        return j;
      });
    }).finally(function () { clearTimeout(timer); });
  }

  function pull() {
    return api('/v1/calendar').then(function (d) {
      Overrides.merge(d && d.overrides);
      return d;
    });
  }

  /** Send everything we hold. The server keeps whichever copy is newer. */
  function push() {
    if (!cfg.token) return Promise.resolve({ applied: 0 });
    var all = Overrides.all();
    return api('/v1/calendar', {
      method: 'POST', auth: true,
      body: { overrides: { series: all.series, occurrence: all.occurrence,
                           custom: all.custom } }
    });
  }

  function saveAndSync(msg) {
    busy = true; render();
    return push()
      .then(pull)
      .then(function () { toast(msg || 'Saved to every device.'); })
      .catch(function (e) { toast('Could not save: ' + e.message); })
      .finally(function () { busy = false; render(); });
  }

  /* ------------------------------------------------------------------ chrome */

  var HUE = { prakash:'gold', gurgaddi:'clay', jotijot:'plum', shaheedi:'crimson',
              festival:'saffron', historic:'forest', janamdin:'green',
              mela:'saffron', modern:'stone', moon:'stone', tithi:'stone',
              sangrand:'gold' };
  var hue = function (c) { return HUE[c] || 'stone'; };
  var CATS = ['prakash','gurgaddi','jotijot','shaheedi','festival','historic',
              'janamdin','mela','modern','sangrand','moon','tithi'];

  var toastTimer;
  function toast(m) {
    var el = $('sbToast');
    el.textContent = m; el.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('on'); }, 3200);
  }

  function renderConn(state) {
    var el = $('sbConn');
    if (state === 'off') {
      el.innerHTML = '<span class="sbed__st sbed__st--off">' +
        '<span class="sbed__dot"></span>Not connected</span>';
      return;
    }
    el.innerHTML = '<span class="sbed__st ' +
      (cfg.token ? 'sbed__st--on' : 'sbed__st--ro') + '">' +
      '<span class="sbed__dot"></span>' +
      (cfg.token ? 'Connected — you can edit' : 'Connected — read only') + '</span>' +
      '<span style="color:var(--ink-3)">' + Overrides.count() + ' change' +
      (Overrides.count() === 1 ? '' : 's') + '</span>';
  }

  /* ------------------------------------------------------------------ setup */

  function renderSetup() {
    $('sbSetup').innerHTML =
      '<div class="sbed__panel">' +
        '<h2>Sign in to edit</h2>' +
        '<p class="d">The passphrase is only needed to <em>save</em>. Leave it blank ' +
          'to look through the calendar without changing anything.</p>' +
        '<div class="sbed__two">' +
          '<div class="sbed__g">' +
            '<label for="sbTok">Editing passphrase</label>' +
            '<input class="sbed__field" id="sbTok" type="password" autocomplete="current-password">' +
          '</div>' +
          '<div class="sbed__g">' +
            '<label style="visibility:hidden">Go</label>' +
            '<button class="sbed__btn sbed__btn--go" id="sbGo" style="height:38px">Open the calendar</button>' +
          '</div>' +
        '</div>' +
        '<p class="sbed__hint" style="margin-top:12px">Anyone can open this page — ' +
          'the calendar is public. Without the passphrase the server refuses every ' +
          'change, so nothing here can be altered by mistake.</p>' +
      '</div>';

    $('sbGo').addEventListener('click', connect);
    $('sbTok').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') connect();
    });
  }

  function connect() {
    cfg.token = ($('sbTok').value || '').trim();
    busy = true; renderConn('off');
    $('sbGo').disabled = true;
    $('sbGo').textContent = 'Checking…';

    api('/v1/health')
      .then(function (h) {
        if (!h || !h.ok) throw new Error('That is not the sync server.');
        if (!cfg.token) return null;
        // A no-op write is the only way to know the passphrase is right before
        // the sevadaar spends ten minutes editing and then cannot save.
        return api('/v1/calendar', { method: 'POST', auth: true, body: { overrides: {} } });
      })
      .then(pull)
      .then(function () {
        save(); busy = false;
        $('sbSetup').hidden = true;
        $('sbMain').hidden = false;
        render();
        toast(cfg.token ? 'Signed in — changes will reach every device.'
                        : 'Opened read-only.');
      })
      .catch(function (e) {
        busy = false;
        cfg.token = '';
        $('sbGo').disabled = false;
        $('sbGo').textContent = 'Open the calendar';
        renderConn('off');
        toast(/passphrase/i.test(e.message) ? 'That passphrase is not right.'
                                            : 'Could not connect: ' + e.message);
      });
  }

  /* ------------------------------------------------------------------- list */

  function rows() {
    var q = ($('sbQ').value || '').trim().toLowerCase();
    var cat = $('sbCat').value;
    var show = $('sbShow').value;
    var out = [];

    // dates the sangat has added
    Overrides.customList().forEach(function (c) {
      out.push({ kind: 'custom', key: c.id, en: c.en, pa: c.pa, cat: c.cat,
                 custom: c, count: null, ov: null });
    });

    // everything printed in the jantri
    SikhEvents.definitions().forEach(function (d) {
      out.push({ kind: 'purab', key: d.en, en: d.en, pa: d.pa, cat: d.cat,
                 def: d, count: d.count, ov: Overrides.series(d) });
    });

    return out.filter(function (r) {
      var ov = r.ov;
      var effCat = (ov && ov.cat) || r.cat;
      if (cat && effCat !== cat) return false;
      if (show === 'edited' && !ov && r.kind !== 'custom') return false;
      if (show === 'hidden' && !(ov && ov.off)) return false;
      if (show === 'added' && r.kind !== 'custom') return false;
      if (!q) return true;
      var name = ((ov && ov.en) || r.en || '') + ' ' + ((ov && ov.pa) || r.pa || '');
      return name.toLowerCase().indexOf(q) >= 0;
    });
  }

  function render() {
    if ($('sbMain').hidden) return;
    renderConn();

    if (!$('sbCat').options.length) {
      $('sbCat').innerHTML = '<option value="">All kinds</option>' +
        CATS.map(function (c) {
          return '<option value="' + c + '">' + esc(SikhEvents.CATEGORIES[c].en) + '</option>';
        }).join('');
    }

    var list = rows();
    var head = '<div class="sbed__row sbed__row--head">' +
      '<span>Purab</span><span class="sbed__cat">Kind</span>' +
      '<span class="sbed__dt">Dates</span><span class="sbed__stt">Status</span>' +
      '<span class="sbed__acts"></span></div>';

    $('sbList').innerHTML = head + (list.length
      ? list.map(rowHtml).join('')
      : '<div class="sbed__empty">Nothing matches that.</div>');

    Array.prototype.forEach.call($('sbList').querySelectorAll('[data-open]'),
      function (b) {
        b.addEventListener('click', function () {
          openDialog(b.dataset.kind, b.dataset.open);
        });
      });

    ['sbSync','sbReset','sbExport'].forEach(function (id) { $(id).disabled = busy; });
  }

  function rowHtml(r) {
    var ov = r.ov;
    var name = (ov && ov.en) || r.en;
    var pa = (ov && ov.pa) || r.pa;
    var cat = SikhEvents.CATEGORIES[(ov && ov.cat) || r.cat] || SikhEvents.CATEGORIES.historic;

    var cls = ['sbed__row'];
    if (r.kind === 'custom') cls.push('sbed__row--new');
    else if (ov) cls.push('sbed__row--ed');
    if (ov && ov.off) cls.push('sbed__row--off');

    var st = [];
    if (r.kind === 'custom') st.push('<span class="sbed__chip c-forest">added by us</span>');
    if (ov && ov.off) st.push('<span class="sbed__chip c-crimson">' +
      (ov.offFrom ? 'hidden from ' + fmt(ov.offFrom) : 'hidden') + '</span>');
    if (ov && (ov.en || ov.pa)) st.push('<span class="sbed__chip c-gold">renamed</span>');
    if (ov && ov.cat) st.push('<span class="sbed__chip c-stone">kind changed</span>');
    if (!st.length) st.push('<span class="sbed__chip c-forest">showing</span>');

    var dates;
    if (r.kind === 'custom') {
      dates = '<b>' + (r.custom.anchor === 'gregorian' ? fmt(r.custom.iso)
              : r.custom.d + ' ' + Cal.monthMeta(r.custom.m).en) + '</b>' +
              '<em>' + (r.custom.repeat === 'yearly' ? 'every year' : 'once') + '</em>';
    } else {
      dates = '<b>' + (r.count || '—') + '</b>' +
              (r.count ? ' date' + (r.count === 1 ? '' : 's') : '') +
              '<em>' + (r.def.first ? fmt(r.def.first) + ' – ' + fmt(r.def.last)
                                    : 'every year') + '</em>';
    }

    return '<button class="' + cls.join(' ') + '" data-open="' + esc(r.key) +
      '" data-kind="' + r.kind + '">' +
      '<span class="sbed__nm"><span class="sbed__pa" lang="pa">' + esc(pa || name) + '</span>' +
      '<span class="sbed__en">' + esc(name) + '</span></span>' +
      '<span class="sbed__cat"><span class="sbed__chip c-' + hue((ov && ov.cat) || r.cat) +
        '">' + esc(cat.en) + '</span></span>' +
      '<span class="sbed__dt">' + dates + '</span>' +
      '<span class="sbed__stt">' + st.join(' ') + '</span>' +
      '<span class="sbed__acts sbed__chip">edit</span>' +
    '</button>';
  }

  function fmt(iso) {
    if (!iso) return '—';
    var d = Cal.parseIso(iso);
    return d.getDate() + ' ' + Cal.G_MONTHS_SHORT[d.getMonth()] + ' ' + d.getFullYear();
  }

  /* ----------------------------------------------------------------- dialog */

  function openDialog(kind, key) {
    if (!cfg.token) { toast('Sign in with the passphrase to make changes.'); return; }
    editing = { kind: kind, key: key };
    if (kind === 'custom') openCustom(key);
    else openPurab(key);
    $('sbOv').classList.add('on');
  }

  function closeDialog() { $('sbOv').classList.remove('on'); editing = null; }

  function catSelect(id, sel) {
    return '<select class="sbed__field" id="' + id + '">' + CATS.map(function (c) {
      return '<option value="' + c + '"' + (c === sel ? ' selected' : '') + '>' +
             esc(SikhEvents.CATEGORIES[c].en) + '</option>';
    }).join('') + '</select>';
  }

  function openPurab(en) {
    var d = SikhEvents.definitions().filter(function (x) { return x.en === en; })[0];
    if (!d) return;
    var ov = Overrides.series(d) || {};
    var today = Cal.isoKey(new Date());

    var dates = (d.dates || []).slice().sort(function (a, b) {
      var fa = a >= today, fb = b >= today;
      if (fa !== fb) return fa ? -1 : 1;
      return fa ? a.localeCompare(b) : b.localeCompare(a);
    });

    $('sbDT').textContent = 'Edit this purab';
    $('sbDS').textContent = d.count
      ? d.count + ' date' + (d.count === 1 ? '' : 's') + ' in the calendar'
      : 'Recurs every year';
    $('sbDDel').hidden = false;
    $('sbDDel').textContent = ov.off ? 'Show it again' : 'Hide it everywhere';

    $('sbDB').innerHTML =
      '<div class="sbed__g"><label for="edPa">Name in Gurmukhi</label>' +
        '<input class="sbed__field" id="edPa" lang="pa" value="' + esc(ov.pa || d.pa || '') + '">' +
        '<span class="sbed__hint">As printed: <span lang="pa">' + esc(d.pa || '—') + '</span></span></div>' +
      '<div class="sbed__g"><label for="edEn">Name in English</label>' +
        '<input class="sbed__field" id="edEn" value="' + esc(ov.en || d.en) + '">' +
        '<span class="sbed__hint">As printed: ' + esc(d.en) + '</span></div>' +
      '<div class="sbed__two">' +
        '<div class="sbed__g"><label for="edCat">Kind</label>' + catSelect('edCat', ov.cat || d.cat) + '</div>' +
        '<div class="sbed__g"><label for="edOff">Show it</label>' +
          '<select class="sbed__field" id="edOff">' +
            '<option value="on"' + (!ov.off ? ' selected' : '') + '>Yes, show it</option>' +
            '<option value="future"' + (ov.off && ov.offFrom ? ' selected' : '') + '>Stop from a date</option>' +
            '<option value="never"' + (ov.off && !ov.offFrom ? ' selected' : '') + '>Hide it entirely</option>' +
          '</select></div>' +
      '</div>' +
      '<div class="sbed__g" id="edFromWrap"' + (ov.off && ov.offFrom ? '' : ' hidden') + '>' +
        '<label for="edFrom">Stop showing from</label>' +
        '<input class="sbed__field" type="date" id="edFrom" value="' + esc(ov.offFrom || today) + '">' +
        '<span class="sbed__hint">Earlier years keep showing, so the record stays intact.</span></div>' +
      (dates.length ?
      '<div class="sbed__g"><label>Its dates — move one without touching the others</label>' +
        '<div class="sbed__dates">' + dates.map(function (iso) {
          var occ = Overrides.occurrence(iso, d) || {};
          var ns = Cal.fromGregorian(Cal.parseIso(iso));
          return '<div class="sbed__dr' + (iso < today ? ' sbed__dr--past' : '') + '">' +
            '<span class="sbed__dn" lang="pa">' + esc(ns.day + ' ' + ns.monthMeta.pa) +
              ' <em>' + ns.year + '</em></span>' +
            '<input class="sbed__field" type="date" data-move="' + iso + '" value="' +
              esc(occ.to || iso) + '">' +
            (occ.to ? '<span class="sbed__chip c-gold">moved</span>' : '<span></span>') +
          '</div>';
        }).join('') + '</div></div>' : '');

    $('edOff').addEventListener('change', function () {
      $('edFromWrap').hidden = $('edOff').value !== 'future';
    });
  }

  function openCustom(id) {
    var e = id ? Overrides.customList().filter(function (x) { return x.id === id; })[0]
               : null;
    var today = Cal.isoKey(new Date());
    var ns = Cal.fromGregorian(new Date());

    $('sbDT').textContent = e ? 'Edit this date' : 'Add a date';
    $('sbDS').textContent = e ? 'Added by the sangat, not in the jantri'
                              : 'It will appear on every connected device';
    $('sbDDel').hidden = !e;
    $('sbDDel').textContent = 'Delete';

    var anchor = e ? e.anchor : 'nanakshahi';
    $('sbDB').innerHTML =
      '<div class="sbed__g"><label for="cuPa">Name in Gurmukhi</label>' +
        '<input class="sbed__field" id="cuPa" lang="pa" placeholder="ਅਖੰਡ ਪਾਠ ਦਾ ਭੋਗ" value="' +
        esc(e ? e.pa : '') + '"></div>' +
      '<div class="sbed__g"><label for="cuEn">Name in English</label>' +
        '<input class="sbed__field" id="cuEn" placeholder="Akhand Paath Bhog" value="' +
        esc(e ? e.en : '') + '"></div>' +
      '<div class="sbed__two">' +
        '<div class="sbed__g"><label for="cuCat">Kind</label>' +
          catSelect('cuCat', e ? e.cat : 'historic') + '</div>' +
        '<div class="sbed__g"><label for="cuRep">Repeats</label>' +
          '<select class="sbed__field" id="cuRep">' +
            '<option value="yearly"' + (!e || e.repeat === 'yearly' ? ' selected' : '') + '>Every year</option>' +
            '<option value="once"' + (e && e.repeat === 'once' ? ' selected' : '') + '>Once only</option>' +
          '</select></div>' +
      '</div>' +
      '<div class="sbed__g"><label for="cuAnchor">Which date does it follow?</label>' +
        '<select class="sbed__field" id="cuAnchor">' +
          '<option value="nanakshahi"' + (anchor === 'nanakshahi' ? ' selected' : '') + '>A Panjabi date — a barsi, a paath</option>' +
          '<option value="gregorian"' + (anchor === 'gregorian' ? ' selected' : '') + '>An English date — a booking, a hall hire</option>' +
        '</select></div>' +
      '<div class="sbed__two" id="cuNsWrap"' + (anchor === 'gregorian' ? ' hidden' : '') + '>' +
        '<div class="sbed__g"><label for="cuM">Month</label>' +
          '<select class="sbed__field" id="cuM">' + Cal.MONTHS.map(function (m) {
            return '<option value="' + m.n + '"' +
              ((e && e.m === m.n) || (!e && m.n === ns.month) ? ' selected' : '') + '>' +
              esc(m.pa + ' · ' + m.en) + '</option>';
          }).join('') + '</select></div>' +
        '<div class="sbed__g"><label for="cuD">Day</label>' +
          '<select class="sbed__field" id="cuD"></select></div>' +
      '</div>' +
      '<div class="sbed__g" id="cuGWrap"' + (anchor === 'gregorian' ? '' : ' hidden') + '>' +
        '<label for="cuIso">English date</label>' +
        '<input class="sbed__field" type="date" id="cuIso" value="' +
          esc(e && e.iso ? e.iso : today) + '"></div>' +
      '<div class="sbed__g"><label for="cuNote">Note (optional)</label>' +
        '<textarea class="sbed__field" id="cuNote" placeholder="Gurdwara, who is doing seva…">' +
        esc(e ? e.note : '') + '</textarea></div>' +
      '<div class="sbed__g"><span class="sbed__hint" id="cuHint"></span></div>';

    fillDays(e ? e.d : ns.day);
    $('cuM').addEventListener('change', function () { fillDays(); hint(); });
    $('cuD').addEventListener('change', hint);
    $('cuIso').addEventListener('change', hint);
    $('cuAnchor').addEventListener('change', function () {
      var g = $('cuAnchor').value === 'gregorian';
      $('cuGWrap').hidden = !g; $('cuNsWrap').hidden = g; hint();
    });
    hint();
  }

  function fillDays(sel) {
    var m = Number($('cuM').value);
    var y = Cal.fromGregorian(new Date()).year;
    var len = Cal.monthLength(y, m);
    var cur = sel || Number($('cuD').value) || 1;
    $('cuD').innerHTML = '';
    for (var i = 1; i <= len; i++) {
      var o = document.createElement('option');
      o.value = i; o.textContent = i;
      if (i === Math.min(cur, len)) o.selected = true;
      $('cuD').appendChild(o);
    }
  }

  function hint() {
    var el = $('cuHint'); if (!el) return;
    var y = Cal.fromGregorian(new Date()).year;
    if ($('cuAnchor').value === 'gregorian') {
      var g = Cal.parseIso($('cuIso').value);
      var ns = Cal.fromGregorian(g);
      el.innerHTML = esc(Cal.gregLong(g)) + ' is ' +
        esc(ns.day + ' ' + ns.monthMeta.en + ' ' + ns.year) + ' Nanakshahi.';
    } else {
      var gg = Cal.toGregorian(y, Number($('cuM').value), Number($('cuD').value));
      el.innerHTML = esc(Number($('cuD').value) + ' ' +
        Cal.monthMeta(Number($('cuM').value)).en) + ' falls on ' +
        esc(Cal.gregShort(gg)) + ' this year.';
    }
  }

  /* ------------------------------------------------------------------ saving */

  function saveDialog() {
    if (!editing) return;
    if (editing.kind === 'custom') {
      var anchor = $('cuAnchor').value;
      var saved = Overrides.saveCustom({
        id: editing.key || null,
        en: $('cuEn').value, pa: $('cuPa').value,
        cat: $('cuCat').value, note: $('cuNote').value,
        anchor: anchor, repeat: $('cuRep').value,
        iso: anchor === 'gregorian' ? $('cuIso').value : '',
        m: $('cuM').value, d: $('cuD').value
      });
      if (!saved) { toast('Give it a name first.'); return; }
      closeDialog();
      saveAndSync('Added — it is on every device now.');
      return;
    }

    var d = SikhEvents.definitions().filter(function (x) {
      return x.en === editing.key; })[0];
    if (!d) return;

    var mode = $('edOff').value;
    var paV = $('edPa').value.trim(), enV = $('edEn').value.trim();
    Overrides.setSeries(d.en, {
      pa: paV && paV !== d.pa ? paV : '',
      en: enV && enV !== d.en ? enV : '',
      cat: $('edCat').value !== d.cat ? $('edCat').value : '',
      off: mode !== 'on',
      offFrom: mode === 'future' ? $('edFrom').value : ''
    });
    Array.prototype.forEach.call($('sbDB').querySelectorAll('[data-move]'),
      function (inp) {
        var from = inp.dataset.move, to = inp.value;
        Overrides.setOccurrence(from, d, { to: to && to !== from ? to : '' });
      });

    closeDialog();
    saveAndSync();
  }

  function deleteFromDialog() {
    if (!editing) return;
    if (editing.kind === 'custom') {
      if (!confirm('Delete this date? It disappears from every device.')) return;
      Overrides.deleteCustom(editing.key);
      closeDialog();
      saveAndSync('Deleted everywhere.');
      return;
    }
    // Printed purabs are never deleted — they are hidden, so the record stands
    // and the change can be undone.
    var d = SikhEvents.definitions().filter(function (x) {
      return x.en === editing.key; })[0];
    if (!d) return;
    var ov = Overrides.series(d) || {};
    Overrides.setSeries(d.en, { off: !ov.off, offFrom: '' });
    closeDialog();
    saveAndSync(ov.off ? 'Showing again.' : 'Hidden on every device.');
  }

  /* ------------------------------------------------------------------- wiring */

  ['sbQ'].forEach(function (id) { $(id).addEventListener('input', render); });
  ['sbCat','sbShow'].forEach(function (id) { $(id).addEventListener('change', render); });

  $('sbAdd').addEventListener('click', function () { openDialog('custom', ''); });
  $('sbDCancel').addEventListener('click', closeDialog);
  $('sbDSave').addEventListener('click', saveDialog);
  $('sbDDel').addEventListener('click', deleteFromDialog);
  $('sbOv').addEventListener('click', function (e) {
    if (e.target === $('sbOv')) closeDialog();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && $('sbOv').classList.contains('on')) closeDialog();
  });

  $('sbSync').addEventListener('click', function () {
    busy = true; render();
    push().then(pull)
      .then(function () { toast('Up to date.'); })
      .catch(function (e) { toast('Sync failed: ' + e.message); })
      .finally(function () { busy = false; render(); });
  });

  $('sbReset').addEventListener('click', function () {
    var n = Overrides.count();
    if (!n) { toast('There is nothing to undo.'); return; }
    if (!confirm('Undo all ' + n + ' change' + (n === 1 ? '' : 's') +
        ' and go back to the printed calendar? This affects every device.')) return;
    Overrides.clearAll();
    saveAndSync('Back to the printed calendar.');
  });

  $('sbExport').addEventListener('click', function () {
    var report = Overrides.report();
    var blob = new Blob([Overrides.exportJson()], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'sikhi-calendar-changes.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    toast(report.length ? report.length + ' change(s) exported.' : 'No changes yet.');
  });

  $('sbDisconnect').addEventListener('click', function () {
    cfg.token = ''; save();
    $('sbMain').hidden = true;
    $('sbSetup').hidden = false;
    renderSetup(); renderConn('off');
    toast('Signed out of editing.');
  });

  /* --------------------------------------------------------------------- boot */

  var fails = Cal.selfTest();
  if (fails.length) console.error('Calendar self-test failed:\n' + fails.join('\n'));

  renderSetup();
  renderConn('off');
  if (cfg.token) { $('sbTok').value = cfg.token; connect(); }
})();
</script>
</body>
</html>
